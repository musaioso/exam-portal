<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MCQ Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. The site is
      // light-first; once the user picks a mode with the toggle it is remembered.
      (function () {
        try {
          var saved = localStorage.getItem("mcq_theme");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <script>
      // Bootstrap safety net. If the app genuinely fails to boot we show a
      // recoverable panel instead of a blank page. The panel is removed the
      // moment the app paints, so a slow mobile connection is never mistaken
      // for a failure.
      (function () {
        var panelEl = null;
        var appMounted = false;

        function rootEl() {
          return document.getElementById("root");
        }
        function bust() {
          var u = new URL(window.location.href);
          u.searchParams.set("v", Date.now().toString());
          window.location.replace(u.toString());
        }
        function dismiss() {
          if (panelEl && panelEl.parentNode) panelEl.parentNode.removeChild(panelEl);
          panelEl = null;
        }
        function markMounted() {
          appMounted = true;
          dismiss();
        }
        function panel() {
          if (appMounted || panelEl) return;
          var box = document.createElement("div");
          box.setAttribute("data-mcq-recovery", "1");
          box.style.cssText =
            "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;" +
            "justify-content:center;padding:24px;background:#0b1120;color:#e2e8f0;" +
            "font:15px/1.7 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center";
          var inner = document.createElement("div");
          inner.style.cssText = "max-width:520px";
          inner.innerHTML = [
            '<h2 style="margin:0 0 10px;font-size:20px">অ্যাপটি লোড হয়নি</h2>',
            '<p style="margin:0 0 18px;color:#94a3b8">',
            "ইন্টারনেট সংযোগ ধীর থাকলে বা সাইটের পুরনো ফাইল সংরক্ষিত থাকলে এমন হতে পারে।",
            "</p>",
            '<button id="mcq-recovery-btn" style="padding:10px 22px;border:0;border-radius:12px;',
            "background:linear-gradient(90deg,#8b5cf6,#22d3ee);color:#fff;font-weight:700;cursor:pointer",
            '">আবার চেষ্টা করুন</button>'
          ].join("");
          box.appendChild(inner);
          panelEl = box;
          var mount = function () {
            if (document.body) document.body.appendChild(box);
          };
          if (document.body) mount();
          else document.addEventListener("DOMContentLoaded", mount);
          var btn = document.getElementById("mcq-recovery-btn");
          if (btn) btn.onclick = bust;
        }
        // Watch #root: as soon as React paints, drop any panel for good.
        function watch() {
          var r = rootEl();
          if (!r) return;
          if (r.children.length > 0) {
            markMounted();
            return;
          }
          if (typeof MutationObserver === "function") {
            var mo = new MutationObserver(function () {
              if (r.children.length > 0) {
                markMounted();
                mo.disconnect();
              }
            });
            mo.observe(r, { childList: true });
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", watch);
        } else {
          watch();
        }
        // Generous grace period: slow mobile data can need a while to download
        // the bundle. Only then is an empty #root treated as a real failure.
        window.setTimeout(function () {
          var r = rootEl();
          if (r && r.children.length === 0) panel();
        }, 15000);
        // Uncaught exceptions during boot also mean a blank page.
        window.addEventListener(
          "error",
          function (e) {
            // Ignore resource load errors (a failed image or chunk); those are
            // not fatal and the app can still be working.
            if (e && e.target && e.target !== window) return;
            var r = rootEl();
            if (r && r.children.length === 0) panel();
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
