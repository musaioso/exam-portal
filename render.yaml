# Render Blueprint for the MCQ Studio backend.
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
#
# NOTE: the free plan has an ephemeral filesystem, so the SQLite file is lost
# whenever the service restarts/redeploys. For persistent data, add a paid
# instance and attach a disk mounted at /var/data (the env vars below already
# point DB_PATH there).
services:
  - type: web
    name: mcq-studio-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /var/data/mcq.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set to your Vercel URL in the dashboard, e.g. https://mcq-studio.vercel.app
    # Uncomment after upgrading to a paid instance to persist the database:
    # disk:
    #   name: mcq-data
    #   mountPath: /var/data
    #   sizeGB: 1
